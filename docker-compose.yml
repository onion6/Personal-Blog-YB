services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=172.25.60.241
      - DB_PORT=3306
      - DB_USER=my_web_db
      - DB_PASSWORD=${DB_PASSWORD:-666888}
      - DB_NAME=${DB_NAME:-my_web_db}
      - STATIC_DIR=/app/frontend/dist
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3001"

  nginx:
    build:
      context: .
      target: nginx-build
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
