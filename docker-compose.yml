services:
  app:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=${DB_HOST:-172.25.60.241}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-my_web_db}
      - DB_PASSWORD=${DB_PASSWORD:-666888}
      - DB_NAME=${DB_NAME:-my_web_db}
      - STATIC_DIR=/app/frontend/dist
      - CORS_ORIGINS=*
      - JWT_SECRET=${JWT_SECRET:-mc-web-yangcong-2024-secure-key-xK9pLm2v}

  nginx:
    build:
      context: .
      target: nginx-build
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
